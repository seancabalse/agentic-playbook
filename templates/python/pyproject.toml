# Starter pyproject.toml for the playbook's Python stack (stacks/python.md). Copy it into the project,
# rename the package, then adjust: this file belongs to the project once copied.
#
#   uv sync && uv run ruff check . && uv run ruff format --check . && uv run mypy && uv run pytest

[project]
name = "your-package"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
# your-cli = "your_package.cli:main"

[dependency-groups]
dev = ["ruff", "mypy", "pytest", "pytest-cov", "hypothesis", "pip-audit"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/your_package"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I isort, B bugbear, UP pyupgrade, S bandit (security), DTZ naive datetimes,
# SIM simplify, RUF ruff-specific, PT pytest style, T20 print, ERA commented-out code, N naming.
select = ["E", "W", "F", "I", "B", "UP", "S", "DTZ", "SIM", "RUF", "PT", "T20", "ERA", "N"]

[tool.ruff.lint.per-file-ignores]
# assert is how pytest checks.
"tests/**" = ["S101"]

[tool.mypy]
strict = true
files = ["src", "tests"]
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
source = ["src"]
branch = true
